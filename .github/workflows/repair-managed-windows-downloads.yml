# Hotfix Managed Cloud Windows download buttons on masatechplc.com.
#
# Website buttons still hit server.masatechplc.com/downloads/cloud-multi/1.0.6/*
# Windows Setup.exe URLs. FTPS cannot refresh those large EXEs, so this workflow
# pushes the small API redirect (api/src/app.js) + Passenger restart.txt so the
# live Node app 302s those URLs to the GitHub Release assets.
#
# Trigger: workflow_dispatch (or after pushing the redirect to release/managed-cloud).

name: Repair Managed Windows Downloads

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag that holds the Windows EXEs'
        required: true
        default: 'desktop-cloud-v1.0.7'

permissions:
  contents: read

jobs:
  hotfix-api-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check downloads secrets
        shell: bash
        env:
          DOWNLOADS_HOST: ${{ secrets.DOWNLOADS_HOST }}
          DOWNLOADS_USERNAME: ${{ secrets.DOWNLOADS_USERNAME }}
          DOWNLOADS_PASSWORD: ${{ secrets.DOWNLOADS_PASSWORD }}
          DOWNLOADS_SERVER_DIR: ${{ secrets.DOWNLOADS_SERVER_DIR }}
        run: |
          missing=0
          [ -z "$DOWNLOADS_HOST" ] && echo "Missing secret: DOWNLOADS_HOST" && missing=1
          [ -z "$DOWNLOADS_USERNAME" ] && echo "Missing secret: DOWNLOADS_USERNAME" && missing=1
          [ -z "$DOWNLOADS_PASSWORD" ] && echo "Missing secret: DOWNLOADS_PASSWORD" && missing=1
          [ -z "$DOWNLOADS_SERVER_DIR" ] && echo "Missing secret: DOWNLOADS_SERVER_DIR" && missing=1
          exit $missing

      - name: Stage API hotfix payload
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -f api/src/app.js
          mkdir -p hotfix/api/src hotfix/api/tmp
          cp api/src/app.js hotfix/api/src/app.js
          # Passenger/Node reload nudge (see docs/MULTI_TENANT_TARBALL_DEPLOY.md)
          date -u +'%Y-%m-%dT%H:%M:%SZ hotfix windows download redirects' > hotfix/api/tmp/restart.txt
          # Optional env snippet operators can merge; primary path is defaults in app.js
          printf 'CLOUD_MULTI_WINDOWS_RELEASE_TAG=%s\n' "$RELEASE_TAG" > hotfix/api/CLOUD_WINDOWS_REDIRECT.env.example
          find hotfix -type f -print

      - name: Upload API hotfix via FTP (try explicit TLS / plain)
        id: ftps
        continue-on-error: true
        shell: bash
        env:
          DOWNLOADS_HOST: ${{ secrets.DOWNLOADS_HOST }}
          DOWNLOADS_USERNAME: ${{ secrets.DOWNLOADS_USERNAME }}
          DOWNLOADS_PASSWORD: ${{ secrets.DOWNLOADS_PASSWORD }}
          DOWNLOADS_SERVER_DIR: ${{ secrets.DOWNLOADS_SERVER_DIR }}
        run: |
          set -euo pipefail
          # DOWNLOADS_SERVER_DIR is e.g. server.masatechplc.com/downloads/cloud-multi/
          # Domain root (API lives next to downloads/) is two parents up.
          SERVER_DIR="${DOWNLOADS_SERVER_DIR%/}"
          DOMAIN_ROOT="$(dirname "$(dirname "$SERVER_DIR")")"
          echo "Domain root (FTP relative): ${DOMAIN_ROOT}"

          USER_ENC="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DOWNLOADS_USERNAME"], safe=""))')"
          PASS_ENC="$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DOWNLOADS_PASSWORD"], safe=""))')"

          # cPanel port 21 is almost always explicit FTPES (ftp:// + --ssl-reqd),
          # not implicit ftps:// on :21 (that yields OpenSSL "wrong version number").
          try_list() {
            local base="$1"
            shift
            curl --silent --show-error --fail --ftp-pasv \
              --connect-timeout 20 --max-time 120 \
              --retry 1 --retry-delay 2 \
              "$@" --list-only "${base}/" | head -5
          }

          AUTH="${USER_ENC}:${PASS_ENC}@${DOWNLOADS_HOST}"
          MODE=""
          BASE=""

          if try_list "ftp://${AUTH}:21/${DOMAIN_ROOT}" --ftp-ssl --ssl-reqd --insecure; then
            MODE="ftp+ssl-reqd"
            BASE="ftp://${AUTH}:21/${DOMAIN_ROOT}"
            CURL_EXTRA=(--ftp-ssl --ssl-reqd --insecure)
          elif try_list "ftp://${AUTH}:21/${DOMAIN_ROOT}" --ftp-ssl --insecure; then
            MODE="ftp+ssl"
            BASE="ftp://${AUTH}:21/${DOMAIN_ROOT}"
            CURL_EXTRA=(--ftp-ssl --insecure)
          elif try_list "ftps://${AUTH}:990/${DOMAIN_ROOT}" --insecure; then
            MODE="ftps:990"
            BASE="ftps://${AUTH}:990/${DOMAIN_ROOT}"
            CURL_EXTRA=(--insecure)
          elif try_list "ftp://${AUTH}:21/${DOMAIN_ROOT}"; then
            MODE="ftp-plain"
            BASE="ftp://${AUTH}:21/${DOMAIN_ROOT}"
            CURL_EXTRA=()
          else
            echo "All FTP probe modes failed"
            exit 1
          fi

          echo "Using FTP mode: ${MODE}"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"

          curl_put() {
            local local_path="$1"
            local remote_path="$2"
            echo "put ${remote_path}"
            curl --silent --show-error --fail --ftp-pasv \
              --connect-timeout 20 --max-time 180 \
              --retry 2 --retry-delay 3 --retry-all-errors \
              --ftp-create-dirs \
              "${CURL_EXTRA[@]}" \
              --upload-file "${local_path}" \
              "${BASE}/${remote_path}"
          }

          curl_put hotfix/api/src/app.js "api/src/app.js"
          curl_put hotfix/api/tmp/restart.txt "api/tmp/restart.txt"
          echo "Hotfix uploaded"

      - name: Upload API hotfix via FTP-Deploy-Action fallback
        if: steps.ftps.outcome != 'success'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DOWNLOADS_HOST }}
          username: ${{ secrets.DOWNLOADS_USERNAME }}
          password: ${{ secrets.DOWNLOADS_PASSWORD }}
          protocol: ftps
          local-dir: hotfix/api/
          # Derive domain root from DOWNLOADS_SERVER_DIR in a prior step — action
          # needs a literal; use downloads parent via secret convention:
          # server.masatechplc.com/api/
          server-dir: server.masatechplc.com/api/
          dangerous-clean-slate: false

      - name: Verify website Managed Windows buttons redirect
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          fail=0
          for path in \
            '/downloads/cloud-multi/1.0.6/PharmaSuit-Cloud-Windows-1.0.6-x64-Setup.exe' \
            '/downloads/cloud-multi/1.0.6/PharmaSuit-Cloud-Windows-1.0.6-ia32-Setup.exe'
          do
            echo "== GET ${path} =="
            headers="$(curl -sI "https://server.masatechplc.com${path}" || true)"
            echo "$headers" | head -15
            if echo "$headers" | grep -qiE '^HTTP/2 302|^HTTP/1\.1 302|^location:.*releases/download/desktop-cloud-v'; then
              echo "OK redirect"
            else
              echo "NOT YET redirected (hotfix may need manual extract of masatech-deploy.tar.gz)"
              fail=1
            fi
          done
          echo "== latest.json =="
          curl -sL 'https://server.masatechplc.com/downloads/cloud-multi/latest.json' | head -40
          if [ "$fail" -ne 0 ]; then
            echo "::warning::Live server not redirected yet. Download masatech-deploy.tar.gz from the Release, extract at domain root, restart Node."
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Repair Managed Windows Downloads"
            echo ""
            echo "- **Release tag:** ${{ inputs.release_tag }}"
            echo "- **FTPS hotfix upload:** ${{ steps.ftps.outcome }}"
            echo "- **Win x64 (GitHub):** https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/PharmaSuit-Cloud-Windows-1.0.7-x64-Setup.exe"
            echo "- **Site button URL (should 302):** https://server.masatechplc.com/downloads/cloud-multi/1.0.6/PharmaSuit-Cloud-Windows-1.0.6-x64-Setup.exe"
            echo ""
            echo "If verify still shows 404: upload \`masatech-deploy.tar.gz\` from the Release and restart the Node app (cPanel)."
          } >> "$GITHUB_STEP_SUMMARY"
