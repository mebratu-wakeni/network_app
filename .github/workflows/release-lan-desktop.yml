# Builds PharmaSuit Dedicated (single-tenant) cloud client and publishes to
# server.masatechplc.com/downloads/lan/
#
# Uses electron-builder.cloud.json5 (NO bundled API) so Mac universal works.
# Does NOT touch downloads/cloud-multi/.
#
# Trigger: tag desktop-lan-v* / desktop-dedicated-v*  OR  manual "Run workflow"
#
# HARD RULE: tag version MUST equal app/package.json version. Installer filenames
# are built from package.json; latest.json URLs use the resolved release version.
# Mismatch → website/in-app download links 404.
#
# Secrets:
#   DOWNLOADS_HOST / DOWNLOADS_USERNAME / DOWNLOADS_PASSWORD
#   DOWNLOADS_LAN_SERVER_DIR — e.g. server.masatechplc.com/downloads/lan/

name: Release LAN Desktop

on:
  push:
    tags:
      - 'desktop-lan-v*'
      - 'desktop-dedicated-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version to build (must match app/package.json unless you bump first)'
        required: false
        default: ''
      mandatory:
        description: 'Mark this release as a required in-app update'
        type: boolean
        default: false
      min_supported_version:
        description: 'Oldest client version still allowed (empty = no floor)'
        required: false
        default: ''

jobs:
  version-lock:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on release/dedicated-cloud
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/dedicated-cloud:refs/remotes/origin/release/dedicated-cloud
          git fetch origin cloud-backend:refs/remotes/origin/cloud-backend || true
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/release/dedicated-cloud; then
            echo "OK: tag commit is on release/dedicated-cloud"
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/cloud-backend 2>/dev/null; then
            echo "WARN: tag is on legacy cloud-backend — prefer release/dedicated-cloud"
          else
            echo "ERROR: tag commit $GITHUB_SHA is not on release/dedicated-cloud"
            echo "Cut desktop-lan-v* / desktop-dedicated-v* tags from release/dedicated-cloud only."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve and lock version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/desktop-dedicated-v* ]]; then
            V="${GITHUB_REF_NAME#desktop-dedicated-v}"
          elif [[ "${{ github.ref }}" == refs/tags/desktop-lan-v* ]]; then
            V="${GITHUB_REF_NAME#desktop-lan-v}"
          else
            V="$(node -p "require('./app/package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          chmod +x scripts/assert-desktop-lan-version.sh
          scripts/assert-desktop-lan-version.sh "$V"

  build:
    needs: version-lock
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Assert package version matches release
        shell: bash
        run: |
          chmod +x scripts/assert-desktop-lan-version.sh
          scripts/assert-desktop-lan-version.sh "${{ needs.version-lock.outputs.version }}"

      - name: Build cloud desktop client (${{ matrix.platform }})
        working-directory: app
        env:
          VITE_CLOUD_MODE: 'true'
          VITE_DEFAULT_SERVER_URL: https://server.masatechplc.com
          VITE_CLOUD_UPDATES_URL: https://server.masatechplc.com/downloads/lan
        run: npm run build:cloud -- --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lan-desktop-${{ matrix.platform }}
          path: |
            app/release-cloud/**
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [version-lock, build]
    runs-on: ubuntu-latest
    # Do NOT publish a partial feed. Failed OS builds used to still rewrite latest.json
    # and wipe working download links.
    if: ${{ always() && needs.build.result == 'success' && needs.version-lock.result == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          name: lan-desktop-mac
          path: staging/artifacts/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: lan-desktop-win
          path: staging/artifacts/win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: lan-desktop-linux
          path: staging/artifacts/linux

      - name: Prepare publish bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d staging/artifacts ] || [ -z "$(find staging/artifacts -type f 2>/dev/null | head -1)" ]; then
            echo "No installer artifacts downloaded — cannot publish."
            exit 1
          fi
          # Hard require all three platforms so latest.json never drops Mac/Win/Linux.
          missing=0
          if [ -z "$(find staging/artifacts/mac -type f \( -iname '*.dmg' -o -iname '*.zip' \) 2>/dev/null | head -1)" ]; then
            echo "ERROR: missing Mac installer (.dmg/.zip)"
            missing=1
          fi
          if [ -z "$(find staging/artifacts/win -type f -iname '*.exe' 2>/dev/null | head -1)" ]; then
            echo "ERROR: missing Windows installer (.exe)"
            missing=1
          fi
          if [ -z "$(find staging/artifacts/linux -type f -iname '*.AppImage' 2>/dev/null | head -1)" ]; then
            echo "ERROR: missing Linux installer (.AppImage)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to publish a partial lan feed."
            find staging/artifacts -type f | sort || true
            exit 1
          fi
          PREPARE_ARGS=(
            --version "${{ needs.version-lock.outputs.version }}"
            --artifacts-dir staging/artifacts
            --out-dir staging/publish
            --notes "PharmaSuit single-tenant cloud ${{ needs.version-lock.outputs.version }}"
            --base-url "https://server.masatechplc.com/downloads/lan"
          )
          if [ "${{ github.event.inputs.mandatory }}" = "true" ]; then
            PREPARE_ARGS+=(--mandatory)
          fi
          if [ -n "${{ github.event.inputs.min_supported_version }}" ]; then
            PREPARE_ARGS+=(--min-supported-version "${{ github.event.inputs.min_supported_version }}")
          fi
          node scripts/prepare-lan-release.mjs "${PREPARE_ARGS[@]}"
          echo "--- publish tree ---"
          find staging/publish -type f | sort
          test -f staging/publish/latest.json
          node -e "
            const j = require('./staging/publish/latest.json');
            for (const k of ['mac','win','linux']) {
              if (!j.artifacts?.[k]?.url) {
                console.error('latest.json missing artifacts.' + k);
                process.exit(1);
              }
            }
            console.log('latest.json platforms OK:', Object.keys(j.artifacts).join(', '));
          "

      - name: Check downloads secrets
        shell: bash
        env:
          DOWNLOADS_HOST: ${{ secrets.DOWNLOADS_HOST }}
          DOWNLOADS_USERNAME: ${{ secrets.DOWNLOADS_USERNAME }}
          DOWNLOADS_PASSWORD: ${{ secrets.DOWNLOADS_PASSWORD }}
          DOWNLOADS_LAN_SERVER_DIR: ${{ secrets.DOWNLOADS_LAN_SERVER_DIR }}
        run: |
          missing=0
          [ -z "$DOWNLOADS_HOST" ] && echo "Missing secret: DOWNLOADS_HOST" && missing=1
          [ -z "$DOWNLOADS_USERNAME" ] && echo "Missing secret: DOWNLOADS_USERNAME" && missing=1
          [ -z "$DOWNLOADS_PASSWORD" ] && echo "Missing secret: DOWNLOADS_PASSWORD" && missing=1
          [ -z "$DOWNLOADS_LAN_SERVER_DIR" ] && echo "Missing secret: DOWNLOADS_LAN_SERVER_DIR (e.g. server.masatechplc.com/downloads/lan/)" && missing=1
          case "$DOWNLOADS_LAN_SERVER_DIR" in
            /home/*)
              echo "ERROR: DOWNLOADS_LAN_SERVER_DIR looks absolute."
              missing=1
              ;;
            *cloud-multi*)
              echo "ERROR: DOWNLOADS_LAN_SERVER_DIR must not point at cloud-multi."
              missing=1
              ;;
          esac
          exit $missing

      - name: Publish to downloads/lan (FTP/FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DOWNLOADS_HOST }}
          username: ${{ secrets.DOWNLOADS_USERNAME }}
          password: ${{ secrets.DOWNLOADS_PASSWORD }}
          protocol: ftps
          local-dir: staging/publish/
          server-dir: ${{ secrets.DOWNLOADS_LAN_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Verify public download feed
        env:
          VERSION: ${{ needs.version-lock.outputs.version }}
          SLEEP_BEFORE: '20'
        run: |
          set -euo pipefail
          chmod +x scripts/verify-download-feed.sh
          scripts/verify-download-feed.sh lan "$VERSION"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Dedicated Cloud desktop published → downloads/lan"
            echo ""
            echo "- **Version:** ${{ needs.version-lock.outputs.version }}"
            echo "- **Downloads:** https://server.masatechplc.com/downloads/lan/"
            echo "- **Update feed:** https://server.masatechplc.com/downloads/lan/latest.json"
            echo "- **Website:** bump Dedicated links in masatech-website \`content/downloads.json\` to \`lan/${{ needs.version-lock.outputs.version }}/\`"
            echo "- **Verified:** public installer URLs from latest.json returned HTTP 200"
          } >> "$GITHUB_STEP_SUMMARY"
